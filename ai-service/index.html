<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Backend Server</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  :root {
    --green: #00ff88;
    --cyan: #00e5ff;
    --dark: #020c08;
    --mid: #041a10;
    --glow: 0 0 12px #00ff8888, 0 0 40px #00ff8830;
    --glow2: 0 0 8px #00e5ff88, 0 0 30px #00e5ff30;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  /* Animated grid background */
  .grid-bg {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,255,136,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 8s linear infinite;
    z-index: 0;
  }
  @keyframes gridMove {
    0%   { background-position: 0 0; }
    100% { background-position: 40px 40px; }
  }

  /* Scanline overlay */
  .scanlines {
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.12) 2px,
      rgba(0,0,0,0.12) 4px
    );
    pointer-events: none;
    z-index: 1;
    animation: scanPulse 4s ease-in-out infinite;
  }
  @keyframes scanPulse {
    0%,100% { opacity: 0.6; }
    50%      { opacity: 1; }
  }

  /* Glitch top bar */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--green), var(--cyan), transparent);
    animation: barGlitch 2s linear infinite;
    z-index: 10;
  }
  @keyframes barGlitch {
    0%,100% { opacity: 1; transform: scaleX(1); }
    50%      { opacity: 0.5; transform: scaleX(0.95) translateX(5px); }
    75%      { opacity: 0.8; transform: scaleX(1.02) translateX(-2px); }
  }

  /* Main container */
  .container {
    position: relative; z-index: 5;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    gap: 2rem;
  }

  /* Status pill */
  .status-pill {
    display: flex; align-items: center; gap: 0.6rem;
    background: rgba(0,255,136,0.08);
    border: 1px solid rgba(0,255,136,0.3);
    border-radius: 999px;
    padding: 0.4rem 1.2rem;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    animation: fadeSlideDown 0.6s ease both;
  }
  .status-dot {
    width: 8px; height: 8px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: var(--glow);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1);   opacity: 1; }
    50%      { transform: scale(1.5); opacity: 0.6; }
  }

  /* Hero title */
  .hero-title {
    text-align: center;
    animation: fadeSlideDown 0.8s ease 0.1s both;
  }
  .hero-title h1 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(2.5rem, 7vw, 5rem);
    font-weight: 900;
    letter-spacing: 0.05em;
    line-height: 1;
    text-shadow: var(--glow);
    animation: titleGlitch 5s ease-in-out infinite;
  }
  @keyframes titleGlitch {
    0%,90%,100% { text-shadow: var(--glow); transform: none; }
    92%  { text-shadow: -2px 0 #ff0066, 2px 0 var(--cyan); transform: translateX(-2px); }
    94%  { text-shadow: 2px 0 #ff0066, -2px 0 var(--cyan); transform: translateX(2px); }
    96%  { text-shadow: var(--glow); transform: none; }
  }
  .hero-title .sub {
    font-size: 0.85rem;
    letter-spacing: 0.3em;
    color: var(--cyan);
    text-transform: uppercase;
    margin-top: 0.5rem;
    text-shadow: var(--glow2);
    animation: blinkText 3s ease-in-out infinite;
  }
  @keyframes blinkText {
    0%,100% { opacity: 1; }
    50%      { opacity: 0.5; }
  }

  /* Stats row */
  .stats-row {
    display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center;
    animation: fadeSlideUp 0.8s ease 0.3s both;
  }
  .stat-card {
    background: rgba(0,255,136,0.05);
    border: 1px solid rgba(0,255,136,0.2);
    border-radius: 8px;
    padding: 1rem 1.5rem;
    text-align: center;
    position: relative;
    overflow: hidden;
    min-width: 110px;
    transition: border-color 0.3s;
  }
  .stat-card::before {
    content: '';
    position: absolute; top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0,255,136,0.1), transparent);
    animation: shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%   { left: -100%; }
    100% { left: 100%; }
  }
  .stat-card:hover { border-color: var(--green); box-shadow: var(--glow); }
  .stat-val {
    font-family: 'Orbitron', monospace;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--green);
    text-shadow: var(--glow);
  }
  .stat-lbl {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(0,255,136,0.5);
    margin-top: 0.2rem;
  }

  /* Terminal log */
  .terminal {
    width: 100%; max-width: 620px;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(0,255,136,0.25);
    border-radius: 10px;
    padding: 1rem 1.2rem;
    font-size: 0.78rem;
    line-height: 1.8;
    animation: fadeSlideUp 0.8s ease 0.5s both;
    max-height: 170px;
    overflow: hidden;
    position: relative;
  }
  .terminal::after {
    content: '';
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 50px;
    background: linear-gradient(transparent, rgba(2,12,8,0.95));
  }
  .log-line { display: flex; gap: 0.8rem; }
  .log-time { color: rgba(0,255,136,0.4); }
  .log-badge {
    padding: 0.05rem 0.4rem;
    border-radius: 3px;
    font-size: 0.65rem;
    font-weight: bold;
    letter-spacing: 0.05em;
  }
  .badge-ok  { background: rgba(0,255,136,0.15); color: var(--green); }
  .badge-info{ background: rgba(0,229,255,0.12); color: var(--cyan); }
  .badge-warn{ background: rgba(255,200,0,0.12); color: #ffd700; }
  .log-msg   { color: rgba(0,255,136,0.75); }

  /* Cursor blink */
  .cursor {
    display: inline-block;
    width: 8px; height: 1em;
    background: var(--green);
    vertical-align: middle;
    animation: cursorBlink 0.9s step-end infinite;
  }
  @keyframes cursorBlink {
    0%,100% { opacity: 1; }
    50%      { opacity: 0; }
  }

  /* Endpoints */
  .endpoints {
    display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;
    animation: fadeSlideUp 0.8s ease 0.7s both;
  }
  .ep {
    background: rgba(0,229,255,0.06);
    border: 1px solid rgba(0,229,255,0.2);
    border-radius: 6px;
    padding: 0.5rem 1rem;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    color: var(--cyan);
    text-shadow: var(--glow2);
    transition: all 0.3s;
    animation: epFloat 3s ease-in-out infinite;
  }
  .ep:nth-child(2) { animation-delay: 0.3s; }
  .ep:nth-child(3) { animation-delay: 0.6s; }
  .ep:nth-child(4) { animation-delay: 0.9s; }
  @keyframes epFloat {
    0%,100% { transform: translateY(0);   border-color: rgba(0,229,255,0.2); }
    50%      { transform: translateY(-4px); border-color: rgba(0,229,255,0.5); }
  }
  .ep:hover {
    background: rgba(0,229,255,0.15);
    box-shadow: var(--glow2);
    transform: translateY(-4px) scale(1.04);
  }
  .ep span { color: rgba(0,229,255,0.55); margin-right: 0.4rem; }

  /* Floating particles */
  .particles { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
  .particle {
    position: absolute;
    width: 2px; height: 2px;
    border-radius: 50%;
    background: var(--green);
    opacity: 0;
    animation: floatUp var(--dur) ease-in infinite;
    animation-delay: var(--delay);
    left: var(--x);
    box-shadow: 0 0 4px var(--green);
  }
  @keyframes floatUp {
    0%   { opacity: 0;   transform: translateY(100vh) scale(1); }
    10%  { opacity: 0.8; }
    90%  { opacity: 0.3; }
    100% { opacity: 0;   transform: translateY(-10vh) scale(0.3); }
  }

  /* Corner decorations */
  .corner { position: fixed; width: 40px; height: 40px; z-index: 8; }
  .corner.tl { top:12px; left:12px; border-top: 2px solid var(--green); border-left: 2px solid var(--green); animation: cornerPulse 2s ease-in-out infinite; }
  .corner.tr { top:12px; right:12px; border-top: 2px solid var(--green); border-right: 2px solid var(--green); animation: cornerPulse 2s ease-in-out infinite 0.5s; }
  .corner.bl { bottom:12px; left:12px; border-bottom: 2px solid var(--green); border-left: 2px solid var(--green); animation: cornerPulse 2s ease-in-out infinite 1s; }
  .corner.br { bottom:12px; right:12px; border-bottom: 2px solid var(--green); border-right: 2px solid var(--green); animation: cornerPulse 2s ease-in-out infinite 1.5s; }
  @keyframes cornerPulse {
    0%,100% { opacity: 0.4; }
    50%      { opacity: 1; box-shadow: var(--glow); }
  }

  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="topbar"></div>
<div class="grid-bg"></div>
<div class="scanlines"></div>

<!-- Corner decorations -->
<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<!-- Floating particles -->
<div class="particles" id="particles"></div>

<div class="container">

  <div class="status-pill">
    <div class="status-dot"></div>
    SERVER ONLINE · PORT 8080
  </div>

  <div class="hero-title">
    <h1>BACKEND<br>SERVER</h1>
    <div class="sub">API · REST · WEBSOCKET · v2.4.1</div>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-val" id="uptime">00:00:00</div>
      <div class="stat-lbl">Uptime</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="reqs">0</div>
      <div class="stat-lbl">Requests</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="ping">12ms</div>
      <div class="stat-lbl">Latency</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="mem">64%</div>
      <div class="stat-lbl">Memory</div>
    </div>
  </div>

  <div class="terminal" id="terminal"></div>

  <div class="endpoints">
    <div class="ep"><span>GET</span>/api/health</div>
    <div class="ep"><span>POST</span>/api/auth</div>
    <div class="ep"><span>GET</span>/api/data</div>
    <div class="ep"><span>WS</span>/socket</div>
  </div>

</div>

<script>
  // Particles
  const pContainer = document.getElementById('particles');
  for(let i = 0; i < 30; i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.setProperty('--x', Math.random()*100 + 'vw');
    p.style.setProperty('--dur', (6 + Math.random()*10) + 's');
    p.style.setProperty('--delay', (Math.random()*10) + 's');
    if(Math.random() > 0.5){ p.style.background = 'var(--cyan)'; p.style.boxShadow = '0 0 4px var(--cyan)'; }
    pContainer.appendChild(p);
  }

  // Uptime counter
  let sec = 0;
  setInterval(() => {
    sec++;
    const h = String(Math.floor(sec/3600)).padStart(2,'0');
    const m = String(Math.floor((sec%3600)/60)).padStart(2,'0');
    const s = String(sec%60).padStart(2,'0');
    document.getElementById('uptime').textContent = `${h}:${m}:${s}`;
  }, 1000);

  // Fake requests counter
  let reqs = 1482;
  setInterval(() => {
    reqs += Math.floor(Math.random()*3);
    document.getElementById('reqs').textContent = reqs.toLocaleString();
  }, 1200);

  // Fake latency
  setInterval(() => {
    document.getElementById('ping').textContent = (8 + Math.floor(Math.random()*20)) + 'ms';
  }, 2000);

  // Fake memory
  setInterval(() => {
    document.getElementById('mem').textContent = (58 + Math.floor(Math.random()*12)) + '%';
  }, 3000);

  // Terminal logs
  const logs = [
    { badge:'OK',   cls:'badge-ok',   msg:'GET /api/health → 200 in 11ms' },
    { badge:'INFO', cls:'badge-info', msg:'WebSocket client connected: 192.168.1.42' },
    { badge:'OK',   cls:'badge-ok',   msg:'POST /api/auth → 200 in 34ms' },
    { badge:'INFO', cls:'badge-info', msg:'Database pool: 5/20 connections active' },
    { badge:'OK',   cls:'badge-ok',   msg:'GET /api/data → 200 in 18ms' },
    { badge:'WARN', cls:'badge-warn', msg:'Rate limit: 90% threshold reached on /api/data' },
    { badge:'OK',   cls:'badge-ok',   msg:'Cache hit ratio: 94.2%' },
    { badge:'INFO', cls:'badge-info', msg:'Scheduled job: cleanup ran successfully' },
    { badge:'OK',   cls:'badge-ok',   msg:'GET /api/users → 200 in 22ms' },
    { badge:'INFO', cls:'badge-info', msg:'New deployment: v2.4.2 ready, awaiting trigger' },
  ];

  const terminal = document.getElementById('terminal');
  let logIdx = 0;

  function addLog() {
    const entry = logs[logIdx % logs.length];
    logIdx++;
    const now = new Date();
    const ts = now.toTimeString().slice(0,8);
    const line = document.createElement('div');
    line.className = 'log-line';
    line.innerHTML = `<span class="log-time">${ts}</span><span class="log-badge ${entry.cls}">${entry.badge}</span><span class="log-msg">${entry.msg}</span>`;
    terminal.appendChild(line);
    const lines = terminal.querySelectorAll('.log-line');
    if(lines.length > 8) lines[0].remove();
    terminal.scrollTop = terminal.scrollHeight;
  }

  for(let i=0;i<5;i++) addLog();
  setInterval(addLog, 2200);
</script>
</body>
</html>
